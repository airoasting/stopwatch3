<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10초 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #06070a;
    --gold: #d4b06a;
    --gold-hi: #f6e5b4;
    --gold-lo: #8a6a32;
    --text: #ece6d8;
    --muted: #8d8678;
    --line: rgba(212, 176, 106, 0.22);
    --bad: #e08a6c;
    --serif: "Cormorant Garamond", "Noto Serif KR", "AppleMyungjo", Georgia, serif;
    --kr: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: var(--kr);
    display: flex;
    justify-content: center;
    padding: 28px 16px 44px;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 70% 50% at 50% 36%, rgba(212, 176, 106, 0.10) 0%, transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 35%, #1b2130 0%, #0b0d12 55%, #050608 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  /* 필름 결. 합성 비용을 줄이려고 블렌드 모드 없이 낮은 불투명도로만 얹는다 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.045;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    z-index: 5;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* ---------- 머리말 ---------- */
  header { text-align: center; }
  .eyebrow {
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0.42em;
    color: var(--gold);
    text-transform: uppercase;
    padding-left: 0.42em;
  }
  h1 {
    margin: 8px 0 0;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fbf1d4 0%, #d9b673 55%, #a47e3f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule {
    width: 120px;
    height: 1px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .targets { display: flex; gap: 4px; align-items: center; }
  .targets button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--serif);
    font-size: 17px;
    padding: 6px 14px 8px;
    cursor: pointer;
    position: relative;
    font-variant-numeric: lining-nums;
    transition: color 0.3s;
  }
  .targets button::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.35s ease, left 0.35s ease;
  }
  .targets button[aria-pressed="true"] { color: var(--gold-hi); }
  .targets button[aria-pressed="true"]::after { width: 60%; left: 20%; }
  .targets button:disabled { cursor: default; opacity: 0.35; }
  .targets .sep { color: var(--gold-lo); font-size: 10px; }

  /* ---------- 시계 ---------- */
  .watch {
    position: relative;
    width: min(86vw, 420px);
    aspect-ratio: 1;
    perspective: 1000px;
    margin: 6px 0 4px;
  }
  .watch::before {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 176, 106, 0.16) 0%, transparent 62%);
    pointer-events: none;
  }
  .tilt {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  .tilt svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  /* 큰 그림자는 움직이지 않는 다이얼에만 건다. 바늘은 별도 SVG라 매 프레임 그림자를 다시 계산하지 않는다 */
  .tilt svg.static {
    filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.65)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
  }
  .rot { transform-origin: 0 0; transform: rotate(0deg); }
  #handWrap { transition: opacity 0.6s ease; }
  #veil { transition: opacity 0.8s ease; }
  #gap { opacity: 0; }
  .tick { opacity: 0; }
  .intro .tick { animation: tickIn 0.5s ease forwards; }
  .ready .tick { opacity: 1; }
  @keyframes tickIn { to { opacity: 1; } }
  .numeral { font-family: var(--serif); font-variant-numeric: lining-nums; }

  /* 글자는 기울이지 않는다(3D 회전 중 흐려짐 방지) */
  .overlay {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
  }
  .attempt {
    top: 31%;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--gold);
    padding-left: 0.32em;
  }
  .attempt .pips { display: flex; gap: 7px; justify-content: center; margin-top: 7px; }
  .attempt .pips i {
    width: 5px; height: 5px;
    transform: rotate(45deg);
    border: 1px solid var(--gold-lo);
    display: block;
  }
  .attempt .pips i.on { background: var(--gold); border-color: var(--gold); }
  .attempt .pips i.miss { background: var(--bad); border-color: var(--bad); }
  .readout { top: 57%; }
  .readout .big {
    font-family: var(--mono);
    font-weight: 300;
    font-size: clamp(30px, 9vw, 40px);
    letter-spacing: 0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }
  .readout .big.dim { color: var(--gold-lo); letter-spacing: 0.3em; }
  .readout .small {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--muted);
    min-height: 16px;
  }
  .readout .small.good { color: var(--gold-hi); }
  .readout .small.bad { color: var(--bad); }
  .reveal { animation: reveal 0.6s ease both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

  /* ---------- 중계 ---------- */
  .caster {
    width: 100%;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 4px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .live {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold);
    border: 1px solid var(--line);
    padding: 4px 7px 4px 8px;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live b {
    width: 6px; height: 6px; border-radius: 50%;
    background: #e5484d;
    box-shadow: 0 0 8px #e5484d;
    display: block;
  }
  .line {
    margin: 0;
    font-size: 16px;
    line-height: 1.65;
    min-height: 53px;
    color: var(--text);
  }
  .line.pop { animation: reveal 0.5s ease both; }
  .delta {
    width: 100%;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    min-height: 16px;
    margin-top: -6px;
  }

  /* ---------- 칭호 카드 ---------- */
  .cert {
    width: 100%;
    text-align: center;
    padding: 18px 16px 18px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(212, 176, 106, 0.08), rgba(212, 176, 106, 0.02));
    position: relative;
  }
  .cert::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(212, 176, 106, 0.12);
    pointer-events: none;
  }
  .cert .eyebrow { font-size: 10px; }
  .cert .title {
    margin-top: 8px;
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(180deg, #fbf1d4 0%, #d9b673 60%, #a47e3f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .cert .avg {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .cert .save {
    position: relative;
    margin-top: 14px;
    background: var(--gold);
    color: #17120a;
    border: none;
    padding: 9px 18px;
    font-family: var(--kr);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- 버튼 ---------- */
  .main {
    width: 100%;
    height: 64px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(212, 176, 106, 0.10), rgba(212, 176, 106, 0.02));
    color: var(--gold-hi);
    font-family: var(--kr);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.3s, color 0.3s, transform 0.06s;
  }
  .main::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 240, 200, 0.25), transparent);
    transform: skewX(-20deg);
    transition: left 0.7s ease;
  }
  .main:hover::after { left: 120%; }
  .main:active { transform: scale(0.99); }
  .main.stop {
    background: linear-gradient(180deg, #f3dca0, #c9a35a);
    color: #17120a;
  }
  .main:focus-visible, .targets button:focus-visible, .share:focus-visible, .save:focus-visible {
    outline: 1px solid var(--gold-hi);
    outline-offset: 4px;
  }

  .share-row { display: flex; gap: 12px; align-items: center; justify-content: center; min-height: 36px; flex-wrap: wrap; }
  .share {
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--gold);
    font-family: var(--kr);
    font-size: 14px;
    padding: 6px 2px;
    cursor: pointer;
  }
  .copied { color: var(--gold-hi); font-size: 13px; }
  .records {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
  }
  .hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    padding: 1px 6px;
    color: var(--gold);
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .intro .tick, .reveal, .line.pop { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app">
  <header>
    <div class="eyebrow" id="eyebrow">The Ten-Second Challenge</div>
    <h1 id="title">10초 맞히기</h1>
    <div class="rule"></div>
  </header>

  <div class="targets" role="group" aria-label="목표 시간">
    <button data-t="5" aria-pressed="false">5초</button><span class="sep">◆</span>
    <button data-t="10" aria-pressed="true">10초</button><span class="sep">◆</span>
    <button data-t="30" aria-pressed="false">30초</button>
  </div>

  <div class="watch" id="watch">
    <div class="tilt" id="tilt">
      <!-- 움직이지 않는 다이얼: 한 번 그리고 캐시된다 -->
      <svg class="static" viewBox="-200 -200 400 400" aria-hidden="true">
        <defs>
          <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fbf0d0"/>
            <stop offset="0.22" stop-color="#b8975a"/>
            <stop offset="0.48" stop-color="#4d3d21"/>
            <stop offset="0.7" stop-color="#d8bc7c"/>
            <stop offset="1" stop-color="#3a2d17"/>
          </linearGradient>
          <linearGradient id="caseInner" x1="1" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#f1dca4"/>
            <stop offset="0.5" stop-color="#5c4826"/>
            <stop offset="1" stop-color="#2a2010"/>
          </linearGradient>
          <radialGradient id="dialGrad" cx="0.5" cy="0.4" r="0.62">
            <stop offset="0" stop-color="#22304a"/>
            <stop offset="0.55" stop-color="#101729"/>
            <stop offset="1" stop-color="#05070d"/>
          </radialGradient>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1c6"/>
            <stop offset="0.5" stop-color="#d4b06a"/>
            <stop offset="1" stop-color="#7c5d2a"/>
          </linearGradient>
          <!-- 폭이 0인 직선에는 objectBoundingBox 그라디언트가 그려지지 않으므로 좌표로 지정 -->
          <linearGradient id="handGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-166" x2="0" y2="34">
            <stop offset="0" stop-color="#fff1c6"/>
            <stop offset="0.6" stop-color="#d4b06a"/>
            <stop offset="1" stop-color="#8a6a32"/>
          </linearGradient>
          <linearGradient id="indexGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8a6a32"/>
            <stop offset="0.45" stop-color="#fff1c6"/>
            <stop offset="0.55" stop-color="#e2c27e"/>
            <stop offset="1" stop-color="#7c5d2a"/>
          </linearGradient>
          <linearGradient id="glassGrad" x1="0.15" y1="0" x2="0.6" y2="0.75">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
            <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
            <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
          </radialGradient>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
          </filter>
          <!-- 얕은 호도 잘리지 않도록 필터 영역을 다이얼 전체 좌표로 고정 -->
          <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="dialClip"><circle r="176"/></clipPath>
        </defs>

        <circle r="199" fill="url(#caseGrad)"/>
        <circle r="191" fill="url(#caseInner)"/>
        <circle r="186" fill="#07090e"/>
        <circle r="183" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>

        <g clip-path="url(#dialClip)">
          <circle r="176" fill="url(#dialGrad)"/>
          <g id="sunburst"></g>
          <circle r="176" fill="url(#vignette)"/>
        </g>
        <circle r="170" fill="none" stroke="rgba(212,176,106,0.28)" stroke-width="0.6"/>
        <circle r="152" fill="none" stroke="rgba(212,176,106,0.18)" stroke-width="0.6"/>
        <circle r="62" fill="none" stroke="rgba(212,176,106,0.14)" stroke-width="0.6"/>

        <g id="ticks"></g>
        <g id="numerals"></g>
        <polygon points="0,-172 -5,-181 5,-181" fill="url(#goldGrad)"/>
      </svg>

      <!-- 움직이는 층: 그림자 필터 없이 가볍게 -->
      <svg class="moving" viewBox="-200 -200 400 400" aria-hidden="true">
        <circle id="veil" r="176" fill="#000" opacity="0"/>
        <path id="gap" fill="none" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
        <g id="handWrap">
          <g transform="translate(2.5 4)" opacity="0.45">
            <g id="handShadow" class="rot">
              <line x1="0" y1="34" x2="0" y2="-166" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
              <circle cy="26" r="6.5" fill="#000"/>
            </g>
          </g>
          <g id="hand" class="rot">
            <line x1="0" y1="34" x2="0" y2="-166" stroke="url(#handGrad)" stroke-width="2.6" stroke-linecap="round"/>
            <line x1="0" y1="-118" x2="0" y2="-166" stroke="#fff5d8" stroke-width="1.3" stroke-linecap="round"/>
            <circle cy="26" r="6.5" fill="url(#goldGrad)"/>
            <circle cy="26" r="2.4" fill="#0b0e15"/>
          </g>
        </g>
        <circle r="9.5" fill="#000" opacity="0.4" transform="translate(1 2)"/>
        <circle r="8.5" fill="url(#goldGrad)"/>
        <circle r="3" fill="#0b0e15"/>
        <circle r="176" fill="url(#glassGrad)" pointer-events="none"/>
      </svg>
    </div>

    <div class="overlay attempt">
      <div id="attemptLabel">ATTEMPT 1 / 3</div>
      <div class="pips" id="pips"><i></i><i></i><i></i></div>
    </div>
    <div class="overlay readout">
      <div class="big" id="big">0.000</div>
      <div class="small" id="small">PRESS START</div>
    </div>
  </div>

  <div class="caster" aria-live="polite">
    <span class="live"><b></b>LIVE</span>
    <p class="line" id="line"></p>
  </div>
  <div class="delta" id="delta"></div>

  <button class="main" id="main">시작</button>

  <div class="cert" id="cert" hidden>
    <div class="eyebrow">Your Title</div>
    <div class="title" id="certTitle"></div>
    <div class="avg" id="certAvg"></div>
    <button class="save" id="saveCard">칭호 카드 이미지로 저장</button>
  </div>

  <div class="share-row">
    <button class="share" id="share" hidden>기록 문구 복사</button>
    <span class="copied" id="copied"></span>
  </div>

  <p class="records" id="records"></p>
  <p class="hint"><kbd>SPACE</kbd> 시작 · 멈춤</p>
</main>

<script>
/* ================= 중계 멘트 ================= */
const LINES = {
  idle: [
    '오늘의 종목은 {t}초 맞히기입니다. 선수 입장합니다.',
    '{t}초 맞히기, 경기장 조명이 켜졌습니다. 준비되면 시작하세요.',
    '관중석 만석입니다. 선수, 손가락 풀고 들어오세요.'
  ],
  start: [
    '출발! 바늘이 보일 때 리듬을 잡으세요.',
    '스타트 좋습니다! 곧 바늘이 사라집니다.',
    '출발했습니다! 지금 바늘을 눈에 새겨 두세요.'
  ],
  hide: [
    '바늘이 사라졌습니다. 이제 선수의 감만 믿습니다.',
    '불이 꺼졌습니다. 여기서부터는 마음속 시계 싸움입니다.',
    '바늘 퇴장. 선수, 속으로 세기 시작합니다.'
  ],
  run: [
    '초침 없는 고요. 들리는 건 선수의 심장 소리뿐입니다.',
    '시계 장인들이 객석에서 숨을 죽이고 있습니다.',
    '중계석 커피가 식어 갑니다. 그 정도로 집중되는 경기입니다.',
    '이 순간 전국의 스탑워치가 숨을 죽이고 있습니다.',
    '해설위원님, 지금 몇 초쯤 됐을까요? 저도 모릅니다.',
    '선수, 속으로 세고 있습니다. 입술이 살짝 움직이는 것 같은데요?',
    '손가락이 버튼 위에서 대기 중입니다. 긴장감 최고조입니다.',
    '카메라가 선수 얼굴을 클로즈업합니다. 표정만 보면 이미 우승입니다.',
    '숨 참지 마세요, 선수! 숨은 시간과 상관이 없습니다.',

let target = 10;
let state = 'idle';

let casterTimers = [];

/* ================= 유틸 ================= */
const NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function polar(r, deg) {
  const a = deg * Math.PI / 180;
  return [r * Math.sin(a), -r * Math.cos(a)];
}

const bags = {};
function draw(key, pool) {
  let bag = bags[key];
  if (!bag || !bag.items.length) {
    const items = pool.map((_, i) => i);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    if (bag && items.length > 1 && items[items.length - 1] === bag.last) {
      [items[0], items[items.length - 1]] = [items[items.length - 1], items[0]];
    }
    bag = bags[key] = { items, last: bag ? bag.last : -1 };
  }
  const i = bag.items.pop();
  bag.last = i;
  return pool[i];
}
const fill = (text, vars) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

function say(text) {
  els.line.textContent = text;
  els.line.classList.remove('pop');
  void els.line.offsetWidth;
  els.line.classList.add('pop');
}

// 사람 손 감각의 분포에 맞춘 구간. 30초는 오차가 커지므로 비례해서 넓힌다
function tierOf(abs) {
  const f = Math.max(1, target / 10);
  const th = [0.05, 0.15, 0.35, 0.7, 1.2].map(x => x * f);
  const i = th.findIndex(x => abs <= x);
  return i === -1 ? 5 : i;
}

const mem = {};
const store = {
  key: () => `tenSecChallenge.v2.${target}`,
  get() {
    try {
      const v = localStorage.getItem(this.key());
      if (v) return JSON.parse(v);
    } catch {}
    return { ...(mem[this.key()] || {}) };
  },
  set(v) {
    mem[this.key()] = { ...v };
    try { localStorage.setItem(this.key(), JSON.stringify(v)); } catch {}
  }
};

/* ================= 다이얼 ================= */
(function buildSunburst() {
  for (let d = 0; d < 360; d += 1.5) {
    const [x, y] = polar(176, d);
    svg('line', {
      x1: 0, y1: 0, x2: x.toFixed(2), y2: y.toFixed(2),
      stroke: d % 3 === 0 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.12)',
      'stroke-width': 1.2
    }, els.sunburst);
  }
})();

function buildDial(animate) {
  els.ticks.innerHTML = '';
  els.numerals.innerHTML = '';
  const majors = target <= 10 ? target : 6;
  const per = 60 / majors;
  for (let i = 0; i < 60; i++) {
    const deg = i * 6;
    const delay = animate ? `${i * 14}ms` : '0ms';
    if (i % per === 0) {
      const g = svg('g', { transform: `rotate(${deg})`, class: 'tick', filter: 'url(#soft)' }, els.ticks);
      g.style.animationDelay = delay;
      if (i === 0) {
        svg('rect', { x: -5.5, y: -167, width: 4, height: 22, fill: 'url(#indexGrad)', rx: 0.6 }, g);
        svg('rect', { x: 1.5, y: -167, width: 4, height: 22, fill: 'url(#indexGrad)', rx: 0.6 }, g);
      } else {
        svg('rect', { x: -2.2, y: -167, width: 4.4, height: 19, fill: 'url(#indexGrad)', rx: 0.6 }, g);
      }
    } else {
      const [x1, y1] = polar(160, deg);
      const [x2, y2] = polar(167, deg);
      const l = svg('line', {
        x1: x1.toFixed(2), y1: y1.toFixed(2), x2: x2.toFixed(2), y2: y2.toFixed(2),
        stroke: '#d9cfb6', 'stroke-width': 1, opacity: 0.6, class: 'tick'
      }, els.ticks);
      l.style.animationDelay = delay;
    }
  }
  for (let k = 0; k < majors; k++) {
    const deg = k * (360 / majors);
    const value = k === 0 ? target : k * target / majors;
    const [x, y] = polar(128, deg);
    const t = svg('text', {
      x: x.toFixed(2), y: y.toFixed(2),
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: k === 0 ? '#f6e5b4' : '#e3d9c1',
      'font-size': k === 0 ? 30 : 22,
      'font-weight': k === 0 ? 600 : 500,
      class: 'numeral tick'
    }, els.numerals);
    t.textContent = value;
    t.style.animationDelay = animate ? `${300 + k * 60}ms` : '0ms';
  }
  els.watch.classList.remove('intro', 'ready');
  void els.watch.offsetWidth;
  els.watch.classList.add(animate ? 'intro' : 'ready');
}

function setHand(deg, transition) {
  const tr = transition || 'none';
  const tf = `rotate(${deg}deg)`;
  els.hand.style.transition = tr;
  els.handShadow.style.transition = tr;
  els.hand.style.transform = tf;
  els.handShadow.style.transform = tf;
}

function sweepIntro() {
  const dur = 1700;
  const s = performance.now();
  setHand(0);
  function step(now) {
    if (state !== 'idle') return;
    const p = Math.min(1, (now - s) / dur);
    setHand((1 - Math.pow(1 - p, 4)) * 360);
    if (p < 1) requestAnimationFrame(step);
    else setHand(0);
  }
  requestAnimationFrame(step);
}

function drawGap(errDeg, good) {
  // 12시(목표)에서 바늘까지의 차이를 호로 그린다. 아주 작은 차이도 보이도록 최소 1.5도
  // 바늘(폭 약 3)에 가려지지 않도록 최소 4도는 그린다
  const span = Math.min(Math.max(Math.abs(errDeg), 4), 359.5);
  const r = 104;   // 숫자 링과 ATTEMPT 라벨 사이 빈 띠. 12시 인덱스와 바늘 끝에 묻히지 않는다
  els.gap.setAttribute('stroke', good ? '#f3d999' : '#e08a6c');
  const a1 = errDeg >= 0 ? 0 : 360 - span;
  const a2 = errDeg >= 0 ? span : 360;
  const [x1, y1] = polar(r, a1);
  const [x2, y2] = polar(r, a2);
  const large = span > 180 ? 1 : 0;
  els.gap.setAttribute('d', `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`);
  const len = els.gap.getTotalLength();
  els.gap.style.transition = 'none';
  els.gap.style.strokeDasharray = len;
  els.gap.style.strokeDashoffset = errDeg >= 0 ? len : -len;
  els.gap.style.opacity = 1;
  void els.gap.getBoundingClientRect();
  els.gap.style.transition = 'stroke-dashoffset 0.7s cubic-bezier(.3,.8,.3,1), opacity 0.3s';
  els.gap.style.strokeDashoffset = 0;
}
function clearGap() {
  els.gap.style.transition = 'opacity 0.3s';
  els.gap.style.opacity = 0;
}

/* ================= 금가루 ================= */
const fx = $('fx');
const ctx = fx.getContext('2d');
let parts = [];
let fxRunning = false;
function resizeFx() {
  const dpr = window.devicePixelRatio || 1;
  fx.width = innerWidth * dpr;
  fx.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeFx();
addEventListener('resize', resizeFx);
function burst(x, y, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.6 + Math.random()) * power;
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * 0.5,
      life: 1, decay: 0.008 + Math.random() * 0.012,
      r: 0.8 + Math.random() * 2, h: 36 + Math.random() * 14, tw: Math.random() * 6
    });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += 0.045;
    p.vx *= 0.985;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    p.tw += 0.3;
    const a = Math.max(0, p.life) * (0.6 + 0.4 * Math.sin(p.tw));
    ctx.fillStyle = `hsla(${p.h}, 85%, 72%, ${a * 0.25})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(${p.h}, 90%, 85%, ${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  if (parts.length) requestAnimationFrame(fxLoop);
  else { fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
function burstAtTop(n, power) {
  const r = els.watch.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * 0.12, n, power);
}

/* ================= 기울기 (마우스에서만, 멈추면 루프도 쉰다) ================= */
let tiltX = 0, tiltY = 0, aimX = 0, aimY = 0, tiltRunning = false;
function tiltLoop() {
  tiltX += (aimX - tiltX) * 0.08;
  tiltY += (aimY - tiltY) * 0.08;
  els.tilt.style.transform = `rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
  if (Math.abs(aimX - tiltX) < 0.005 && Math.abs(aimY - tiltY) < 0.005) { tiltRunning = false; return; }
  requestAnimationFrame(tiltLoop);
}
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  aimY = (e.clientX / innerWidth - 0.5) * 10;
  aimX = -(e.clientY / innerHeight - 0.5) * 10;
  if (!tiltRunning) { tiltRunning = true; requestAnimationFrame(tiltLoop); }
});

/* ================= 화면 갱신 ================= */
function renderPips() {
  [...els.pips.children].forEach((p, i) => {
    p.className = '';
    if (i < tries.length) p.className = tierOf(Math.abs(tries[i])) <= 2 ? 'on' : 'miss';
  });
  const n = state === 'running' ? tries.length + 1 : state === 'result' ? tries.length : 1;
  els.attemptLabel.textContent = `ATTEMPT ${Math.min(Math.max(n, 1), ROUND)} / ${ROUND}`;
}

function renderRecords() {
  const b = store.get();
  const parts = [];
  if (b.single != null) parts.push(`BEST ${b.single.toFixed(3)}s`);
  if (b.avg != null) parts.push(`AVG ${b.avg.toFixed(3)}s`);
  els.records.textContent = parts.length ? `${target}초 개인 기록 · ${parts.join(' · ')}` : `${target}초 개인 기록 · 아직 없음`;
}

function setMainLabel() {
  els.main.classList.toggle('stop', state === 'running');
  if (state === 'running') els.main.textContent = '멈춰';
  else if (state === 'idle') els.main.textContent = '시작';
  else els.main.textContent = tries.length >= ROUND ? '새로 도전' : '다음 시도';
}

function resetPanels() {
  els.delta.textContent = '';
  els.cert.hidden = true;
  els.share.hidden = true;
  els.copied.textContent = '';
}

function setTarget(t) {
  target = t;
  hideMs = target * 300;   // 목표와 상관없이 앞의 30%만 바늘을 보여 준다
  tries = [];
  lastAbs = null;
  state = 'idle';
  clearTimeout(revealTimer);
  lockUntil = 0;
  targetBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.t === t)));
  els.eyebrow.textContent = `The ${EN[t]}-Second Challenge`;
  els.title.textContent = `${t}초 맞히기`;
  document.title = `${t}초 맞히기`;
  els.big.textContent = '0.000';
  els.big.className = 'big';
  els.small.textContent = 'PRESS START';
  els.small.className = 'small';
  resetPanels();
  els.veil.setAttribute('opacity', 0);
  els.handWrap.style.opacity = 1;
  clearGap();
  buildDial(true);
  sweepIntro();
  renderPips();
  renderRecords();
  setMainLabel();
  say(fill(draw('idle', LINES.idle), { t }));
}

/* ================= 진행 ================= */
function frame() {
  const ms = performance.now() - t0;
  if (ms >= hideMs) {
    els.handWrap.style.opacity = 0;
    els.veil.setAttribute('opacity', 0.35);
    els.big.textContent = '· · ·';
    els.big.className = 'big dim';
    els.small.textContent = 'COUNT IN YOUR HEAD';
    return;
  }
  setHand(ms / (target * 1000) * 360);
  els.big.textContent = (ms / 1000).toFixed(2);
  rafId = requestAnimationFrame(frame);
}

function clearCaster() {
  casterTimers.forEach(clearTimeout);
  casterTimers = [];
}
function scheduleRunLine() {
  // 멘트 간격을 불규칙하게 해서 박자 힌트가 되지 않게 한다
  const wait = 2200 + Math.random() * 2600;
  casterTimers.push(setTimeout(() => {
    if (state !== 'running') return;
    say(draw('run', LINES.run));
    scheduleRunLine();
  }, wait));
}

function start() {
  if (tries.length >= ROUND) tries = [];
  clearTimeout(revealTimer);
  state = 'running';
  els.veil.setAttribute('opacity', 0);
  els.handWrap.style.opacity = 1;
  setHand(0);
  clearGap();
  els.big.textContent = '0.00';
  els.big.className = 'big';
  els.small.textContent = 'RUNNING';
  els.small.className = 'small';
  resetPanels();
  targetBtns.forEach(b => b.disabled = true);
  renderPips();
  setMainLabel();
  say(draw('start', LINES.start));
  t0 = performance.now();
  rafId = requestAnimationFrame(frame);
  casterTimers.push(setTimeout(() => {
    if (state !== 'running') return;
    say(draw('hide', LINES.hide));
    scheduleRunLine();
  }, hideMs));
}

function stop(now) {
  const elapsed = (now - t0) / 1000;
  cancelAnimationFrame(rafId);
  clearCaster();
  state = 'result';
  lockUntil = Infinity;   // 판독이 끝날 때까지 입력을 받지 않는다

  const err = elapsed - target;
  const abs = Math.abs(err);
  const tier = tierOf(abs);
  const good = tier <= 2;
  tries.push(err);

  // 1막: 정적. 바늘이 멈춘 자리로 휘어 돌아간다
  els.main.classList.remove('stop');
  els.main.textContent = '판독 중';
  els.big.textContent = '';
  els.small.textContent = '';
  say('경기 종료! 판독에 들어갑니다…');
  els.veil.setAttribute('opacity', 0);
  els.handWrap.style.opacity = 1;
  setHand(elapsed / target * 360, 'transform 1.1s cubic-bezier(.2,.85,.25,1.08)');

  revealTimer = setTimeout(() => {
    // 2막: 결과 공개. 버튼 라벨이 바뀌는 순간부터 바로 누를 수 있다
    lockUntil = 0;
    targetBtns.forEach(b => b.disabled = false);
    drawGap(err / target * 360, good);

    els.big.textContent = elapsed.toFixed(3);
    els.big.className = 'big reveal';
    els.small.textContent = abs < 0.0005 ? 'PERFECT' : `${err > 0 ? '+' : '−'}${abs.toFixed(3)}s ${err > 0 ? 'LATE' : 'EARLY'}`;
    els.small.className = 'small reveal ' + (good ? 'good' : 'bad');

    if (lastAbs != null) {
      const d = lastAbs - abs;
      els.delta.textContent = Math.abs(d) < 0.0005
        ? '직전과 똑같은 오차입니다. 소름.'
        : d > 0 ? `직전보다 ${d.toFixed(3)}초 더 가까워졌습니다 ▲`
                : `직전보다 ${(-d).toFixed(3)}초 멀어졌습니다 ▼`;
    }
    lastAbs = abs;

    const pools = LINES.result[tier];
    const side = err > 0 ? 'late' : 'early';
    const pool = [...pools.any, ...(pools[side] || [])];
    let text = fill(draw(`result${tier}${side}`, pool), { e: abs.toFixed(3) });

    // 기록: 한 라운드(3번) 이상 쌓인 뒤부터만 신기록을 외친다
    const best = store.get();
    const priorCount = best.count || 0;
    let newRecord = false;
    if (best.single == null || abs < best.single) {
      if (best.single != null && priorCount >= ROUND) newRecord = true;
      best.single = abs;
    }
    best.count = priorCount + 1;

    if (tries.length >= ROUND) {
      const avg = tries.reduce((s, e) => s + Math.abs(e), 0) / tries.length;
      const title = TITLES[tierOf(avg)];
      if (best.avg == null || avg < best.avg) {
        if (best.avg != null) newRecord = true;
        best.avg = avg;
      }
      lastRound = { avg, title, tries: [...tries], target };
      // iOS는 클릭 뒤 비동기 작업을 거치면 공유를 막으므로 이미지를 미리 만들어 둔다
      cardBlob = null;
      const thisRound = lastRound;
      makeCard(thisRound).then(b => { if (lastRound === thisRound) cardBlob = b; }).catch(() => {});
      els.certTitle.textContent = `「${title}」`;
      els.certAvg.textContent = `${target}초 · ${ROUND}번 평균 오차 ${avg.toFixed(3)}초`;
      els.cert.hidden = false;
      els.cert.classList.remove('reveal');
      void els.cert.offsetWidth;
      els.cert.classList.add('reveal');
      // 마지막 판의 결과 멘트를 살리고 칭호 발표를 이어 붙인다
      text += ' ' + fill(LINES.round, { n: ROUND, a: avg.toFixed(3), title });
      els.share.dataset.text =
        `⏱️ ${target}초 맞히기 ${ROUND}번 도전! 평균 ${avg.toFixed(3)}초 틀렸고 칭호는 「${title}」 ㅋㅋ 너는 몇 초 나와?`;
    } else {
      els.share.dataset.text =
        `⏱️ ${target}초 맞히기: 바늘 안 보고 ${elapsed.toFixed(3)}초에 멈춤 (${abs.toFixed(3)}초 차이) ㅋㅋ 너는 몇 초 나와?`;
    }
    if (newRecord) text += LINES.record;
    store.set(best);

    say(text);
    els.share.hidden = false;
    renderPips();
    renderRecords();
    setMainLabel();

    if (tier === 0) burstAtTop(140, 4.2);
    else if (tier === 1) burstAtTop(70, 3.2);
    else if (tier === 2) burstAtTop(24, 2.2);
    if (newRecord) setTimeout(() => burstAtTop(50, 3.6), 350);
  }, 1150);
}

function act(now) {
  if (state === 'running') stop(now);
  else if (now >= lockUntil) start();
}

/* ================= 칭호 카드 이미지 ================= */
async function makeCard(r) {
  const W = 1080, H = 1350;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const titleText = `「${r.title}」`;
  try {
    await Promise.all([
      document.fonts.load('700 76px "Noto Serif KR"', titleText + '너는 몇 초 나와?초맞히기'),
      document.fonts.load('500 34px "Cormorant Garamond"', 'THE CHALLENGE'),
      document.fonts.load('400 34px "IBM Plex Mono"', '0123456789.+-s')
    ]);
  } catch {}

  // 배경
  const bg = g.createRadialGradient(W / 2, 520, 40, W / 2, 560, 900);
  bg.addColorStop(0, '#1f2a40');
  bg.addColorStop(0.55, '#0c111c');
  bg.addColorStop(1, '#040507');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // 테두리
  g.strokeStyle = 'rgba(212,176,106,0.55)';
  g.lineWidth = 2;
  g.strokeRect(40, 40, W - 80, H - 80);
  g.strokeStyle = 'rgba(212,176,106,0.2)';
  g.strokeRect(54, 54, W - 108, H - 108);

  const gold = (y1, y2) => {
    const gr = g.createLinearGradient(0, y1, 0, y2);
    gr.addColorStop(0, '#fbf1d4');
    gr.addColorStop(0.55, '#d9b673');
    gr.addColorStop(1, '#a47e3f');
    return gr;
  };
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  // 머리말
  g.fillStyle = '#d4b06a';
  g.font = '500 30px "Cormorant Garamond", serif';
  if ('letterSpacing' in g) g.letterSpacing = '12px';
  g.fillText(`THE ${EN[r.target].toUpperCase()}-SECOND CHALLENGE`, W / 2, 140);
  if ('letterSpacing' in g) g.letterSpacing = '0px';

  // 작은 다이얼 + 세 번의 바늘
  const cx = W / 2, cy = 520, R = 250;
  const ring = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  ring.addColorStop(0, '#fbf0d0');
  ring.addColorStop(0.3, '#b8975a');
  ring.addColorStop(0.5, '#4d3d21');
  ring.addColorStop(0.75, '#d8bc7c');
  ring.addColorStop(1, '#3a2d17');
  g.fillStyle = ring;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  const face = g.createRadialGradient(cx, cy - 60, 10, cx, cy, R);
  face.addColorStop(0, '#22304a');
  face.addColorStop(0.6, '#101729');
  face.addColorStop(1, '#05070d');
  g.fillStyle = face;
  g.beginPath(); g.arc(cx, cy, R - 18, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30;
    const major = i % 5 === 0;
    g.strokeStyle = major ? '#e2c27e' : 'rgba(217,207,182,0.6)';
    g.lineWidth = major ? 5 : 1.6;
    const r1 = R - 32, r2 = major ? R - 62 : R - 44;
    g.beginPath();
    g.moveTo(cx + r1 * Math.sin(a), cy - r1 * Math.cos(a));
    g.lineTo(cx + r2 * Math.sin(a), cy - r2 * Math.cos(a));
    g.stroke();
  }
  r.tries.forEach((e, i) => {
    const a = (r.target + e) / r.target * Math.PI * 2;
    const len = R - 50;
    g.strokeStyle = i === r.tries.length - 1 ? '#fff1c6' : 'rgba(212,176,106,0.55)';
    g.lineWidth = i === r.tries.length - 1 ? 5 : 3;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + len * Math.sin(a), cy - len * Math.cos(a));
    g.stroke();
  });
  g.fillStyle = '#d4b06a';
  g.beginPath(); g.arc(cx, cy, 13, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0b0e15';
  g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();

  // 칭호
  g.fillStyle = '#8d8678';
  g.font = '500 28px "Cormorant Garamond", serif';
  if ('letterSpacing' in g) g.letterSpacing = '10px';
  g.fillText('YOUR TITLE', W / 2, 860);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  let size = 76;
  g.font = `700 ${size}px "Noto Serif KR", serif`;
  while (g.measureText(titleText).width > W - 200 && size > 40) {
    size -= 4;
    g.font = `700 ${size}px "Noto Serif KR", serif`;
  }
  g.fillStyle = gold(920, 1000);
  g.fillText(titleText, W / 2, 955);

  // 기록
  g.fillStyle = '#ece6d8';
  g.font = '400 34px "IBM Plex Mono", monospace';
  g.fillText(`AVG ${r.avg.toFixed(3)}s`, W / 2, 1050);
  g.fillStyle = '#8d8678';
  g.font = '400 26px "IBM Plex Mono", monospace';
  g.fillText(r.tries.map(e => `${e >= 0 ? '+' : '−'}${Math.abs(e).toFixed(3)}`).join('   '), W / 2, 1100);

  // 도전장
  g.fillStyle = gold(1170, 1220);
  g.font = '700 40px "Noto Serif KR", serif';
  g.fillText(`${r.target}초 맞히기 · 너는 몇 초 나와?`, W / 2, 1200);

  return new Promise(res => c.toBlob(res, 'image/png'));
}

els.saveCard.addEventListener('click', async () => {
  if (!lastRound) return;
  els.saveCard.disabled = true;
  const name = `${lastRound.target}초맞히기_칭호.png`;
  const download = blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  try {
    // 미리 만든 이미지가 있으면 기다리지 않고 바로 공유를 부른다
    const blob = cardBlob || await makeCard(lastRound);
    const file = new File([blob], name, { type: 'image/png' });
    let done = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: els.share.dataset.text || '' });
        done = true;
      } catch (e) {
        if (e && e.name === 'AbortError') done = true;   // 사용자가 공유 창을 닫음
      }
    }
    if (!done) download(blob);
    els.saveCard.textContent = '저장했습니다';
  } catch {
    els.saveCard.textContent = '저장하지 못했습니다';
  }
  setTimeout(() => {
    els.saveCard.disabled = false;
    els.saveCard.textContent = '칭호 카드 이미지로 저장';
  }, 1800);
});

/* ================= 입력 ================= */
// 누르는 순간 반응해야 오차가 정확하다(click은 손을 뗄 때 발생)
els.main.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  act(performance.now());
});
els.main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); act(performance.now()); }
});
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (e.repeat) return;
  act(performance.now());
});
document.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });

targetBtns.forEach(b => b.addEventListener('click', () => {
  if (state !== 'running' && +b.dataset.t !== target) setTarget(+b.dataset.t);
}));

els.share.addEventListener('click', async () => {
  const text = els.share.dataset.text || '';
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  els.copied.textContent = ok ? '복사했습니다. 단톡방에 붙여 넣으세요.' : '복사하지 못했습니다';
});

setTarget(10);
</script>
